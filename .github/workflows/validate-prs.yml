# MidSizedClinic — soft PR metadata check (not Microsoft FHIR Team ADO ceremony).
name: Validate Pull Request

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - unlabeled
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

env:
  TITLE: ${{ github.event.pull_request.title }}

jobs:
  js-title:
    name: Check Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          TITLE: ${{ env.TITLE }}
        with:
          script: |
            // Soft gate for MidSizedClinic fork demos.
            // Do NOT require AB# / ADO work items, milestones, or Microsoft release labels.
            const title = process.env.TITLE || "";
            const errors = [];

            if (title.toLowerCase().includes("personal")) {
              errors.push("- Title should not include 'personal'.");
            }
            if (title.length > 65) {
              errors.push("- Title should be succinct and less than 65 characters.");
            }

            if (errors.length) {
              core.setFailed(errors.join("\n"));
            } else {
              core.info("Check Metadata OK (MidSizedClinic soft validation — no AB#/milestone/label requirements).");
            }
