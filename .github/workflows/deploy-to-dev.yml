# MidSizedClinic — Deploy to Dev (local Docker).
# Pipeline: Tests gate → Deploy (compose + /metadata smoke).
# Required status check name (branch protection): "Deploy"
name: Deploy to Dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-to-dev-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Same complexity-satisfying password used by local-setup
  SAPASSWORD: L0cal-Dev-Pwd1

jobs:
  # Gate before deploy. This repo enables Microsoft Testing Platform
  # (Directory.Build.props TestingPlatformDotnetTestSupport) — use MTP args after `--`,
  # not VSTest --filter/--logger (those fail with "Unknown option" / exit 5).
  # MidSizedClinic scope: treenode filter *ImagingStudy* (add-fhir-resource-type tests).
  # Exit code 5 = zero tests matched — allowed until ImagingStudy tests are wired.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore test projects
        run: |
          dotnet restore src/Microsoft.Health.Fhir.R4.Core.UnitTests/Microsoft.Health.Fhir.R4.Core.UnitTests.csproj
          dotnet restore test/Microsoft.Health.Fhir.R4.Tests.E2E/Microsoft.Health.Fhir.R4.Tests.E2E.csproj

      - name: Test — ImagingStudy scope (MTP)
        run: |
          set -euo pipefail
          # Args after -- are Microsoft.Testing.Platform (not VSTest).
          # Exit 5/8 = zero tests matched (code varies by MTP version) — OK until
          # *ImagingStudy* tests exist via add-fhir-resource-type.
          run_filtered() {
            local proj="$1"
            local code=0
            echo "=== $proj ==="
            set +e
            dotnet test "$proj" \
              --configuration Release \
              --no-restore \
              -- \
              --treenode-filter "*ImagingStudy*" \
              --report-trx \
              --results-directory TestResults \
              --ignore-exit-code "5;8"
            code=$?
            set -e
            if [[ "$code" -eq 0 || "$code" -eq 5 || "$code" -eq 8 ]]; then
              echo "Tests gate OK for $proj (exit $code — 5/8 means zero ImagingStudy matches)"
              return 0
            fi
            echo "ERROR: test run failed for $proj with exit $code" >&2
            return "$code"
          }
          run_filtered src/Microsoft.Health.Fhir.R4.Core.UnitTests/Microsoft.Health.Fhir.R4.Core.UnitTests.csproj
          run_filtered test/Microsoft.Health.Fhir.R4.Tests.E2E/Microsoft.Health.Fhir.R4.Tests.E2E.csproj

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-to-dev-test-results
          path: TestResults/**
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose up (local-setup equivalent)
        run: |
          set -euo pipefail
          docker compose \
            -f samples/docker/docker-compose.yaml \
            -f .cursor/skills/local-setup/docker-compose.local.yaml \
            -f midsizedclinic-demo-app/docker-compose.demo.yaml \
            up -d --build

      - name: Smoke test — GET /metadata == 200
        run: |
          set -euo pipefail
          echo "Waiting for FHIR /metadata on :8080 ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/fhir-metadata.json -w "%{http_code}" http://localhost:8080/metadata || true)
            if [ "$code" = "200" ]; then
              echo "metadata OK (attempt $i)"
              head -c 200 /tmp/fhir-metadata.json || true
              echo
              exit 0
            fi
            echo "attempt $i: HTTP $code — retry in 5s"
            sleep 5
          done
          echo "ERROR: /metadata did not return 200 within ~5 minutes"
          docker compose \
            -f samples/docker/docker-compose.yaml \
            -f .cursor/skills/local-setup/docker-compose.local.yaml \
            -f midsizedclinic-demo-app/docker-compose.demo.yaml \
            ps || true
          docker compose \
            -f samples/docker/docker-compose.yaml \
            -f .cursor/skills/local-setup/docker-compose.local.yaml \
            -f midsizedclinic-demo-app/docker-compose.demo.yaml \
            logs --tail=80 fhir-api || true
          exit 1

      - name: Docker Compose down
        if: always()
        run: |
          docker compose \
            -f samples/docker/docker-compose.yaml \
            -f .cursor/skills/local-setup/docker-compose.local.yaml \
            -f midsizedclinic-demo-app/docker-compose.demo.yaml \
            down -v || true
