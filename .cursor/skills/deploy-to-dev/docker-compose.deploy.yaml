# Deploy-to-Dev stack — separate compose project + host ports so it can run
# alongside local-setup (project "docker", FHIR :8080, SQL :1433) without replacing it.
#
#   docker compose \
#     -f samples/docker/docker-compose.yaml \
#     -f .cursor/skills/local-setup/docker-compose.local.yaml \
#     -f .cursor/skills/deploy-to-dev/docker-compose.deploy.yaml \
#     up -d --build
#
# Smoke: http://localhost:8081/metadata
name: midsizedclinic-deploy

services:
  fhir-api:
    build:
      args:
        ASSEMBLY_VER: "1.0.0"
    environment:
      FHIRServer__Security__Authentication__Authority: "https://localhost/unused"
    ports: !override
      - "8081:8080"
  sql:
    # Not required for /metadata smoke; published so host tools can hit this stack
    # without colliding with local-setup's :1433.
    ports: !override
      - "1434:1433"
